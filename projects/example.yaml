# Copy to projects/<name>.yaml and fill in. Real project configs are gitignored.

name: my-app
# Issues whose key starts with this (MYAPP-12) belong to this project.
jiraProject: MYAPP

repo:
  url: https://bitbucket.org/<workspace>/<repo>.git
  baseBranch: main
  # bitbucket: clone with BITBUCKET_TOKEN from .env. none: public or local repository.
  auth: bitbucket

# Image the agents run in: aidev-node, aidev-flutter or aidev-base. Build with `aidev build`.
image: aidev-node

# Shell commands run from the repo root. All must pass before a pull request is opened.
checks:
  - npm ci
  - npm test

# People added as reviewers on every pull request, by Atlassian account ID. Jira and
# Bitbucket share the ID: it's the end of the person's Jira profile address,
# https://<site>.atlassian.net/jira/people/<account ID>. Bitbucket won't add a pull
# request's own author, so leave yourself out if BITBUCKET_TOKEN is your own API token.
prReviewers: []

# The Jira workflow. `aidev watch` picks up tickets in pickUp; the rest are where aidev moves
# a ticket. Leave one out and the ticket stays where it is. To retry a stuck ticket, answer
# it and move it back to pickUp.
jiraStatus:
  pickUp: AI Tasks      # tickets waiting for aidev
  working: In Progress  # while aidev works on it
  prOpened: In Review   # once the pull request is open
  stuck: To Do          # when aidev can't finish: it needs an answer, failed review 3 times, or broke

# Paths agents may never change, on top of the defaults (.git, .claude, CI config, .env, keystores).
protectedPaths: []

# Everything below is optional; these are the defaults.
worker:
  model: opus           # a Claude Code alias (opus, sonnet, fable) or a full model name; fable needs usage credits on a subscription
  fallbackModel: sonnet # used when the model is overloaded; "" turns it off
  # effort: xhigh       # low, medium, high, xhigh or max; unset uses Claude Code's default
  maxTurns: 200
  timeoutMinutes: 90

limits:
  cpus: 4
  memory: 8g
  pids: 2048
